# ============================================================================
# TASSONOMIA STANDARD — Corpus testi Movimento dei Focolari
# Vocabolario controllato multilingue (it / en / ur) per il tagging automatico
# Versione 0.2 — nucleo iniziale arricchito con lo spoglio del catalogo "Discorsi"
# (1089 record: AUTORE, LUOGO, TIPO, A_CHI, TITOLO) e con la terminologia canonica
# del Manuale di stile urdu v2.0.
#
# REGOLA PERMANENTE DELLA GRAFIA
#   I testi Focolare scrivono tuttora la vocale accentata come vocale +
#   apostrofo: UNITA'  SPIRITUALITA'  GESU'ABBANDONATO  CITTA'NUOVA  E'  PERCHE'
#   La normalizzazione (normalizza.py) la converte sempre, in indicizzazione
#   e in ricerca. Negli alias qui sotto si scrive quindi la forma piana
#   ("unita", "Gesu Abbandonato"): copre da sola accentata, apostrofata e nuda.
#
# Struttura di ogni tag:
#   id       identificatore stabile e immutabile (MAI cambiarlo: e' la chiave nel DB)
#   facet    faccetta di appartenenza (vedi elenco facets)
#   pref     etichetta preferita per lingua (cio' che si mostra all'utente)
#   alt      alias FORTI: se compaiono, il tag e' assegnato
#   weak     alias DEBOLI/ambigui: contano solo se nel documento c'e' gia' un match forte
#            dello stesso tag, altrimenti finiscono nel report "da rivedere"
#   broader  id del tag padre (gerarchia per la ricerca allargata)
#   note     nota di ambito per il redattore (scope note)
# ============================================================================

version: "0.2"
lingue: [it, en, ur]

facets:
  PER: {label_it: Persone,               note: "Persone storiche e figure citate"}
  BRA: {label_it: Branche e diramazioni, note: "Vocazioni, sezioni, movimenti ad ampio raggio"}
  ORG: {label_it: Strutture e organi,    note: "Governo, articolazione territoriale, istituzioni"}
  SPI: {label_it: Punti della spiritualita, note: "I 12 punti cardine dell'Ideale"}
  TEM: {label_it: Temi spirituali,       note: "Temi teologici e ascetici ricorrenti non coincidenti con i 12 punti"}
  STR: {label_it: Strumenti di comunione, note: "I 5 strumenti della spiritualita collettiva"}
  COL: {label_it: Sette colori,          note: "Aspetti concreti della vita, per colore"}
  ADA: {label_it: Arte di amare,         note: "I punti dell'arte di amare"}
  EVE: {label_it: Eventi e appuntamenti, note: "Congressi, scuole, appuntamenti ricorrenti"}
  LUO: {label_it: Luoghi,                note: "Cittadelle, sedi, toponimi rilevanti"}
  PUB: {label_it: Fonti e pubblicazioni, note: "Riviste, editrici, documenti normativi"}
  GEN: {label_it: Genere testuale,       note: "Tipologia del documento (assegnata a mano o da metadato)"}
  DES: {label_it: Destinatario,          note: "Pubblico a cui il testo si rivolge"}

tags:

