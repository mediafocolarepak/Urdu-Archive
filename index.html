<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focolare Urdu Archive Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7a5230">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css?v=20260902170240">
<style>
#login-screen, #recovery-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
#login-card, #recovery-card { width: 100%; max-width: 360px; }
#login-error, #recovery-error { color: var(--danger); font-size: 12.5px; margin-top: 8px; min-height: 16px; }
.auth-switch { font-size: 12.5px; text-align: center; margin-top: 10px; color: var(--ink-soft); }
.auth-switch a { color: var(--accent); cursor: pointer; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="panel" id="login-card">
    <h2 style="text-align:center;">Focolare Urdu Archive Manager</h2>
    <p class="hint" style="text-align:center; margin-bottom:16px;">Team sign-in (shared database)</p>
    <div class="field"><label>Email</label><input id="login-email" type="email" autocomplete="username"></div>
    <div class="field"><label id="login-password-label">Password</label><input id="login-password" type="password" autocomplete="new-password"></div>
    <div id="signup-fields" style="display:none;">
      <div class="field"><label>Full name</label><input id="signup-fullname" type="text" autocomplete="name"></div>
      <div class="field"><label>City</label><input id="signup-city" type="text" autocomplete="address-level2"></div>
      <div class="field"><label>Focolare membership type</label><select id="signup-membership"></select></div>
      <div class="field"><label>Mobile phone</label><input id="signup-phone" type="tel" autocomplete="tel"></div>
    </div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn" id="login-btn" style="flex:1;">Sign in</button>
      <button class="btn" id="signup-btn" style="flex:1; display:none;">Sign up</button>
    </div>
    <div id="login-error"></div>
    <div class="auth-switch"><span id="auth-switch-hint">New here?</span> <a id="auth-switch-link">Sign up</a></div>
    <div class="auth-switch" id="forgot-password-row"><a id="forgot-password-link">Forgot your password?</a></div>
  </div>
</div>

<div id="recovery-screen" style="display:none;">
  <div class="panel" id="recovery-card">
    <h2 style="text-align:center;">Set a new password</h2>
    <p class="hint" style="text-align:center; margin-bottom:16px;">You followed a password reset link - choose a new password below.</p>
    <div class="field"><label>New password</label><input id="recovery-password" type="password" autocomplete="new-password"></div>
    <div class="field"><label>Confirm new password</label><input id="recovery-password-confirm" type="password" autocomplete="new-password"></div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn" id="recovery-save-btn" style="flex:1;">Set new password</button>
    </div>
    <div id="recovery-error"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <div id="topbar">
    <h1>Focolare Urdu Archive Manager</h1>
    <div id="tabs"></div>
    <div id="status-bar">
      <div id="standing-widget" style="display:none;"></div>
      <span id="user-email" class="hint"></span>
      <button class="btn secondary" id="logout-btn">Sign out</button>
      <span class="dot" id="dirty-dot"></span>
      <span id="dirty-label">Connected</span>
    </div>
  </div>
  <div id="main"><div class="empty-msg">Loading...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
<script>if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js';</script>
<script type="module" src="js/app.js?v=20260902170240"></script>
</body>
</html>
